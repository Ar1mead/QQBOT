name: CSD cognitive slice tests

on:
  push:
    branches:
      - feature/csd-cognitive-memory-slice
    paths:
      - "core/csd/**"
      - "tests/test_csd_cognitive.py"
      - "tests/test_csd_proposal_pipeline.py"
      - "tests/test_csd_grounded_memory.py"
      - "tests/test_csd_grounded_proposal_pipeline.py"
      - ".github/workflows/csd-cognitive-slice.yml"
  pull_request:
    paths:
      - "core/csd/**"
      - "tests/test_csd_cognitive.py"
      - "tests/test_csd_proposal_pipeline.py"
      - "tests/test_csd_grounded_memory.py"
      - "tests/test_csd_grounded_proposal_pipeline.py"
      - ".github/workflows/csd-cognitive-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognitive-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile CSD and tests
        run: python -m compileall -q core tests
      - name: Run cognitive-memory slice tests
        run: python -m unittest discover -s tests -p "test_csd_cognitive.py" -v
      - name: Run provider-neutral proposal pipeline tests
        run: python -m unittest discover -s tests -p "test_csd_proposal_pipeline.py" -v
      - name: Run grounded-memory v2 tests
        run: python -m unittest discover -s tests -p "test_csd_grounded_memory.py" -v
      - name: Run grounded-memory provider pipeline tests
        run: python -m unittest discover -s tests -p "test_csd_grounded_proposal_pipeline.py" -v
      - name: Run existing persistence baseline tests
        run: python -m unittest discover -s tests -p "test_csd_store.py" -v
